name: PocketAgent
options:
  bundleIdPrefix: com.example.pocketagent
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pocket Agent
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  PocketAgent:
    type: application
    platform: iOS
    sources:
      - path: PocketAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketagent
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
