name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: xcodebuild -project PocketAgent.xcodeproj -scheme PocketAgent -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/PocketAgent.app build/Payload/
          cd build
          zip -r PocketAgent-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-unsigned-ipa
          path: build/PocketAgent-unsigned.ipa
          if-no-files-found: error
