name: Build SpringBoard Overlay PoC

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "OverlayPoC/**"
      - ".github/workflows/build-overlay-poc.yml"

jobs:
  build-rootless-tweak:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos build dependencies
        run: brew install ldid xz
      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" latest
      - name: Build rootless package for arm64 and arm64e
        run: make -C OverlayPoC package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: PocketOverlayPoC-rootless-deb
          path: OverlayPoC/packages/*.deb
          if-no-files-found: error
          retention-days: 14
